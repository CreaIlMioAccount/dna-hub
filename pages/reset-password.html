<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reimposta Password - DNA Informatica</title>
  <link rel="icon" type="image/x-icon" href="../assets/favicon/favicon.ico">
  <link rel="stylesheet" href="../css/style.css">
  
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background-color: var(--bg-elev); transition: background-color 0.3s; }
    .auth-container { width: 100%; max-width: 450px; padding: 40px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); position: relative; }
    
    /* Stile per il link "Torna al sito" (uguale alle altre pagine) */
    .back-link { position: absolute; top: 20px; left: 20px; color: var(--text-muted); text-decoration: none; display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 500; transition: color var(--transition); }
    .back-link:hover { color: var(--text); }
    
    .auth-header { text-align: center; margin-bottom: 30px; margin-top: 20px; }
    .auth-header img { height: 90px; margin: 0 auto 20px; display: block; }
    .auth-header h1 { font-size: 24px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
    .auth-header p { font-size: 14px; color: var(--text-muted); }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text); }
    .form-group input { width: 100%; padding: 12px 14px; border-radius: var(--radius-md); border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 14px; font-family: inherit; }
    .form-group input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .btn-submit { width: 100%; padding: 12px; font-size: 15px; }
    .auth-footer { text-align: center; margin-top: 24px; font-size: 13px; color: var(--text-muted); }
    .auth-footer a { color: var(--accent); font-weight: 600; text-decoration: none; }
    .theme-toggle-wrapper { position: absolute; top: 20px; right: 20px; }
    
    /* Dark mode per i loghi */
    html[data-theme="dark"] .logo-light { display: none !important; }
    html[data-theme="dark"] .logo-dark { display: block !important; }
    html[data-theme="light"] .logo-light { display: block !important; }
    html[data-theme="light"] .logo-dark { display: none !important; }
  </style>
</head>
<body>

  <div class="auth-container">
    <!-- LINK TORNA AL SITO -->
    <a href="../index.html" class="back-link">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Torna al sito
    </a>

    <div class="theme-toggle-wrapper">
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Cambia tema">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
      </button>
    </div>

    <div class="auth-header">
      <img src="../assets/images/logo-nero.png" alt="DNA Informatica" class="logo-light">
      <img src="../assets/images/logo-bianco.png" alt="DNA Informatica" class="logo-dark">
      <h1>Reimposta Password</h1>
      <p>Inserisci la tua nuova password</p>
    </div>

    <form id="resetForm">
      <div class="form-group">
        <label for="password">Nuova Password</label>
        <input type="password" id="password" placeholder="Minimo 8 caratteri" required minlength="8">
      </div>
      <div class="form-group">
        <label for="confirmPassword">Conferma Password</label>
        <input type="password" id="confirmPassword" placeholder="Ripeti la password" required minlength="8">
      </div>
      <button type="submit" class="btn btn-primary btn-submit" id="submitBtn">Salva Nuova Password</button>
    </form>

    <div class="auth-footer">
      Ricordi la password? <a href="login.html">Torna al login</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // --- TEMA ---
    const html = document.documentElement;
    const themeToggle = document.getElementById('themeToggle');
    const savedTheme = localStorage.getItem('dna-theme') || 'light';
    html.setAttribute('data-theme', savedTheme);

    if(themeToggle) {
      themeToggle.addEventListener('click', () => {
        const current = html.getAttribute('data-theme');
        html.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
        localStorage.setItem('dna-theme', current === 'dark' ? 'light' : 'dark');
      });
    }

    // --- RESET PASSWORD ---
    const SUPABASE_URL = 'https://wqtywckdavadoqjunkhl.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_iSHItBqOWsFVXduYinpx6Q_JNiNXPE5';
    const supabaseAuth = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (password !== confirmPassword) {
        alert('Le password non coincidono!');
        return;
      }

      btn.textContent = 'Salvataggio...';
      btn.disabled = true;

      const { error } = await supabaseAuth.auth.updateUser({ password: password });

      if (error) {
        alert('Errore: ' + error.message);
        btn.textContent = 'Salva Nuova Password';
        btn.disabled = false;
      } else {
        alert('Password aggiornata con successo! Ora puoi fare il login.');
        window.location.href = 'login.html';
      }
    });
  </script>
</body>
</html>
