<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DNA Hub - Documentazione</title>
    <!-- I percorsi ../ servono per uscire da 'pages' ed entrare in 'css' -->
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/documentazione.css">
    
    <!-- Il tuo file di connessione a Supabase -->
    <script src="../js/supabase-client.js"></script>
</head>
<body>

    <div class="app-container">
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="logo"><h2>DNA Hub</h2></div>
            <nav class="menu">
                <!-- Ho adattato i nomi dei link a quelli che vedo nel tuo screenshot -->
                <a href="index.html">Dashboard</a>
                <a href="elenco-clienti.html">Clienti</a>
                <a href="progetti.html">Progetti</a>
                <a href="contratti.html">Contratti</a>
                <a href="servizi.html">Servizi</a>
                <a href="documentazione.html" class="active">Documentazione</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div class="search-bar">
                    <input type="text" id="search-input" placeholder="Cerca un documento...">
                </div>
                <div class="user-profile"><span>Admin</span></div>
            </header>

            <div class="content-wrapper">
                <div class="page-title">
                    <h1>Area Documentazione</h1>
                    <button class="btn-primary" onclick="apriModaleUpload()">+ Carica Documento</button>
                </div>

                <div class="dashboard-cards">
                    <div class="card"><h3>Documenti Totali</h3><p id="stat-totale">0</p></div>
                    <div class="card"><h3>Documenti Riservati</h3><p id="stat-riservati">0</p></div>
                    <div class="card"><h3>Spazio Occupato</h3><p id="stat-spazio">0 MB</p></div>
                </div>

                <div class="table-container">
                    <table class="document-table">
                        <thead>
                            <tr>
                                <th>Titolo</th>
                                <th>Categoria</th>
                                <th>Riservatezza</th>
                                <th>Data</th>
                                <th>Azioni</th>
                            </tr>
                        </thead>
                        <tbody id="lista-documenti">
                            <tr><td colspan="5" style="text-align: center;">Caricamento documenti...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- MODALE UPLOAD -->
    <div id="modale-upload" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Carica Nuovo Documento</h2>
                <button class="close-btn" onclick="chiudiModaleUpload()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="form-upload">
                    <div class="form-group">
                        <label>Titolo Documento</label>
                        <input type="text" id="doc-titolo" required>
                    </div>
                    <div class="form-group">
                        <label>Categoria</label>
                        <select id="doc-categoria" required></select>
                    </div>
                    <div class="form-group">
                        <label>Livello Riservatezza</label>
                        <select id="doc-riservatezza" required>
                            <option value="pubblico">Pubblico</option>
                            <option value="interno" selected>Interno</option>
                            <option value="riservato">Riservato</option>
                            <option value="amministrazione">Amministrazione</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>File</label>
                        <input type="file" id="doc-file" required>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="chiudiModaleUpload()">Annulla</button>
                <button class="btn-primary" id="btn-upload" onclick="caricaDocumento()">Carica</button>
            </div>
        </div>
    </div>

    <script src="../js/documentazione.js"></script>
</body>
</html>
