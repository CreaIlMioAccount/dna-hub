<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Progetti — DNA Hub</title>
  
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/app-shell.css">
  <style> body { visibility: hidden; } </style>
</head>
<body class="app-body">

  <aside class="app-sidebar">
    <div class="sidebar-header">
      <a href="../index.html" class="sidebar-logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        <span class="sidebar-logo-text">DNA Hub</span>
      </a>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-group">
        <div class="nav-group-title">Clienti</div>
        <a href="../index.html" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span class="nav-item-text">Dashboard</span>
        </a>
        <a href="elenco-clienti.html" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span class="nav-item-text">Elenco Clienti</span>
        </a>
        <a href="nuovo-cliente.html" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          <span class="nav-item-text">Nuovo Cliente</span>
        </a>
      </div>

      <div class="nav-group">
        <div class="nav-group-title">Operatività</div>
        <a href="ticket.html" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
          <span class="nav-item-text">Ticket e Assistenza</span>
        </a>
        <a href="progetti.html" class="nav-item is-active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
          <span class="nav-item-text">Progetti</span>
        </a>
      </div>
    </nav>

    <a href="impostazioni.html" class="sidebar-footer" style="text-decoration:none; color:inherit;">
      <div class="sidebar-avatar">MR</div>
      <div class="sidebar-user-info">
        <div class="sidebar-user-name">Mario Rossi</div>
        <div class="sidebar-user-role">Amministratore</div>
      </div>
    </a>
  </aside>

  <header class="app-header">
    <div class="header-left">
      <button class="btn-toggle-sidebar" id="toggleSidebar" aria-label="Comprimi menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="header-search" onclick="DNAHub.Palette.open()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
        <span>Cerca ovunque...</span>
      </div>
    </div>
    <div class="header-right">
      <button class="header-action-btn" aria-label="Notifiche" onclick="window.location.href='ticket.html'">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span class="notification-badge">3</span>
      </button>
      <a href="../../index.html" class="btn btn--secondary btn--sm" style="margin-left: 8px;">Torna al sito</a>
      <button class="btn btn--danger btn--sm" style="margin-left: 8px;" id="btnLogoutHeader">Esci</button>
    </div>
  </header>

  <main class="app-main">
    <div class="flex justify-between items-center mb-6">
      <div>
        <h1 class="page-title">Progetti</h1>
        <p class="page-subtitle">Monitora l'avanzamento dei lavori e le scadenze.</p>
      </div>
      <button class="btn btn--primary" data-open-modal="modal-nuovo-progetto">+ Nuovo Progetto</button>
    </div>

    <div id="grigliaProgetti" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: var(--space-6);">
      <p class="text-center w-full p-4">Caricamento dal database...</p>
    </div>
  </main>

  <div class="modal-backdrop" id="modal-nuovo-progetto" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="modal__header">
        <h3 class="modal__title">Nuovo Progetto</h3>
        <button class="btn btn--ghost btn--icon btn--sm" data-close-modal="modal-nuovo-progetto" aria-label="Chiudi">×</button>
      </div>
      <div class="modal__body">
        <div class="field mb-4">
          <label class="field__label" for="prog-nome">Nome Progetto <span class="req">*</span></label>
          <input class="input" id="prog-nome" type="text" placeholder="Es. Sviluppo Sito Web">
        </div>
        <div class="field mb-4">
          <label class="field__label" for="prog-stato">Stato Iniziale</label>
          <select class="select" id="prog-stato">
            <option value="In corso">In corso</option>
            <option value="In ritardo">In ritardo</option>
            <option value="Completato">Completato</option>
          </select>
        </div>
        <div class="field mb-4">
          <label class="field__label" for="prog-avanzamento">Avanzamento (%)</label>
          <input class="input" id="prog-avanzamento" type="number" min="0" max="100" value="0">
        </div>
      </div>
      <div class="modal__footer">
        <button class="btn btn--secondary" data-close-modal="modal-nuovo-progetto">Annulla</button>
        <button class="btn btn--primary" id="btnCreaProgetto">Crea Progetto</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { supabase } from '../assets/js/supabase-client.js';

    const { data: { session } } = await supabase.auth.getSession();
    if (!session) {
      window.location.href = '../login.html';
    } else {
      document.body.style.visibility = 'visible';

      document.getElementById('btnLogoutHeader')?.addEventListener('click', async () => {
        await supabase.auth.signOut();
        window.location.href = '../login.html';
      });

      async function caricaProgetti() {
        const griglia = document.getElementById('grigliaProgetti');
        griglia.innerHTML = '<p class="text-center w-full p-4">Caricamento...</p>';

        const { data: progetti, error } = await supabase.from('progetti').select('*').order('created_at', { ascending: false });

        if (error) {
          griglia.innerHTML = `<p class="text-center text-danger w-full p-4">Errore: ${error.message}</p>`;
          return;
        }

        if (progetti.length === 0) {
          griglia.innerHTML = '<p class="text-center w-full p-4">Nessun progetto trovato.</p>';
          return;
        }

        griglia.innerHTML = progetti.map(progetto => {
          let coloreBarra = 'var(--color-primary)';
          let classeBadge = 'badge--info';
          if (progetto.stato === 'In ritardo') { coloreBarra = 'var(--color-danger)'; classeBadge = 'badge--danger'; }
          if (progetto.stato === 'Completato') { coloreBarra = 'var(--color-success)'; classeBadge = 'badge--success'; }

          const avanzamento = Math.min(100, Math.max(0, progetto.avanzamento || 0));

          return `
            <div class="card card--interactive" onclick="window.location.href='cliente.html'">
              <div class="flex justify-between items-start mb-4">
                <div>
                  <div class="t-xs text-secondary mb-1">Cliente: —</div>
                  <h3 class="t-md w-semibold">${progetto.nome}</h3>
                </div>
                <span class="badge ${classeBadge}">${progetto.stato}</span>
              </div>
              
              <div class="mb-4">
                <div class="flex justify-between t-sm mb-2">
                  <span class="text-secondary">Avanzamento</span>
                  <span class="w-semibold">${avanzamento}%</span>
                </div>
                <div style="height: 6px; background: var(--color-surface-hover); border-radius: var(--radius-full); overflow: hidden;">
                  <div style="width: ${avanzamento}%; height: 100%; background: ${coloreBarra}; border-radius: var(--radius-full);"></div>
                </div>
              </div>

              <div class="flex justify-between items-center t-sm pt-4" style="border-top: 1px solid var(--color-border);">
                <div class="flex items-center gap-2">
                  <div class="sidebar-avatar" style="width:24px; height:24px; font-size:10px;">MR</div>
                  <span class="text-secondary">Mario Rossi</span>
                </div>
                <span class="text-secondary">${new Date(progetto.created_at).toLocaleDateString('it-IT')}</span>
              </div>
            </div>
          `;
        }).join('');
      }

      document.getElementById('btnCreaProgetto').addEventListener('click', async (e) => {
        e.preventDefault();
        const nome = document.getElementById('prog-nome').value;
        const stato = document.getElementById('prog-stato').value;
        const avanzamento = parseInt(document.getElementById('prog-avanzamento').value) || 0;
        
        if (!nome) { alert("Il nome del progetto è obbligatorio!"); return; }

        const btn = document.getElementById('btnCreaProgetto');
        btn.innerHTML = 'Creazione...';
        btn.disabled = true;

        const { error } = await supabase.from('progetti').insert([{ nome: nome, stato: stato, avanzamento: avanzamento }]);

        btn.innerHTML = 'Crea Progetto';
        btn.disabled = false;

        if (error) {
          alert("Errore: " + error.message);
        } else {
          if (window.DNAHub) {
            window.DNAHub.Modal.close('modal-nuovo-progetto');
            window.DNAHub.Toast.show({ title: "Successo", message: "Progetto creato.", variant: "success" });
          }
          document.getElementById('prog-nome').value = '';
          document.getElementById('prog-avanzamento').value = '0';
          caricaProgetti();
        }
      });

      caricaProgetti();
    }
  </script>

  <script src="../assets/js/components.js"></script>
</body>
</html>
