<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DNA Informatica</title>

  <link rel="icon" type="image/x-icon" href="assets/favicon/favicon.ico">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ============ HEADER ============ -->
<header class="site-header" id="siteHeader">
  <div class="header-inner">

    <!-- Logo -->
    <a href="index.html" class="logo">
      <!-- Immagine per Sfondo Chiaro (Light Mode) -->
      <img src="assets/images/logo-nero.png" alt="DNA Informatica" class="logo-light">
      
      <!-- Immagine per Sfondo Scuro (Dark Mode) -->
      <img src="assets/images/logo-bianco.png" alt="DNA Informatica" class="logo-dark">
    </a>

    <!-- Navigazione desktop -->
    <nav class="nav-desktop" aria-label="Navigazione principale">
      
      <!-- Contenitore per lo scroll e le frecce -->
      <div class="nav-scroll-container">
        
        <!-- Freccia Sinistra -->
        <button class="nav-arrow prev" id="navArrowPrev" aria-label="Scorri a sinistra">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>

        <!-- Lista Voci -->
        <ul class="nav-list">
          
          <!-- Voce Home -->
          <li class="nav-item" data-menu="home">
            <button class="nav-link" type="button" aria-expanded="false">
              <span>Home</span>
              <svg class="nav-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
            </button>
          </li>
      



          <!-- Voce Prodotti -->
          <li class="nav-item" data-menu="prodotti">
            <button class="nav-link" type="button" aria-expanded="false">
              <span>Prodotti</span>
              <svg class="nav-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
            </button>
          </li>



    <!-- Voce Tecnologie -->
        <li class="nav-item" data-menu="tecnologie">
          <button class="nav-link" type="button" aria-expanded="false">
            <span>Tecnologie</span>
            <svg class="nav-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
          </button>
        </li>







          <!-- Voce Soluzioni -->
          <li class="nav-item" data-menu="soluzioni">
            <button class="nav-link" type="button" aria-expanded="false">
              <span>Soluzioni</span>
              <svg class="nav-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
            </button>
          </li>

          <!-- Voce Servizi -->
          <li class="nav-item" data-menu="servizi">
            <button class="nav-link" type="button" aria-expanded="false">
              <span>Servizi</span>
              <svg class="nav-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
            </button>
          </li>

          <!-- Voce Settori -->
          <li class="nav-item" data-menu="settori">
            <button class="nav-link" type="button" aria-expanded="false">
              <span>Settori</span>
              <svg class="nav-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
            </button>
          </li>

          <!-- Voce Risorse -->
          <li class="nav-item" data-menu="risorse">
            <button class="nav-link" type="button" aria-expanded="false">
              <span>Risorse</span>
              <svg class="nav-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
            </button>
          </li>

          <!-- Voce Azienda -->
          <li class="nav-item" data-menu="azienda">
            <button class="nav-link" type="button" aria-expanded="false">
              <span>Azienda</span>
              <svg class="nav-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
            </button>
          </li>

          <!-- Voce Supporto -->
          <li class="nav-item" data-menu="supporto">
            <button class="nav-link" type="button" aria-expanded="false">
              <span>Supporto</span>
              <svg class="nav-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
            </button>
          </li>

          <!-- Indicatore attivo -->
          <li class="nav-indicator" aria-hidden="true"></li>
        </ul>

        <!-- Freccia Destra -->
        <button class="nav-arrow next" id="navArrowNext" aria-label="Scorri a destra">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
        </button>

      </div>
    </nav>

    <!-- Azioni a destra -->
    <div class="header-actions">
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Cambia tema">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
        </svg>
      </button>

      <a href="login.html" class="btn btn-ghost">Accedi</a>
      <a href="registrati.html" class="btn btn-primary">Inizia</a>

      <!-- Hamburger mobile -->
      <button class="hamburger" id="hamburger" type="button" aria-label="Apri menu" aria-expanded="false" aria-controls="mobileMenu">
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
      </button>
    </div>

  </div>

  <!-- ============ MEGA MENU ============ -->
  <div class="mega-menu" id="megaMenu" aria-hidden="true">
    <div class="mega-inner" id="megaInner"><!-- generato via JS --></div>
  </div>
</header>

<!-- ============ MENU MOBILE ============ -->
<div class="mobile-menu" id="mobileMenu" aria-hidden="true">
  <div class="mobile-menu-header">
    <a href="index.html" class="logo">
      <img src="assets/images/logo-nero.png" alt="DNA Informatica" class="logo-light">
      <img src="assets/images/logo-bianco.png" alt="DNA Informatica" class="logo-dark">
    </a>
    <button class="mobile-close" id="mobileClose" type="button" aria-label="Chiudi menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>

  <div class="mobile-menu-body" id="mobileBody"><!-- generato via JS --></div>

  <div class="mobile-menu-footer">
    <a href="login.html" class="btn btn-ghost">Accedi</a>
    <a href="registrati.html" class="btn btn-primary">Inizia</a>
  </div>
</div>

<!-- Overlay -->
<div class="mobile-overlay" id="mobileOverlay"></div>

<main>
  <!-- Contenuto del sito esistente -->
</main>

<script src="js/script.js"></script>
